$schema: https://json-schema.org/draft/2020-12/schema
$id: https://nexoraxs.local/schemas/reference-capability.schema.yaml
title: Canonical Cross-Repository Reference Capability
type: object
additionalProperties: false
required:
  - schema_version
  - record_type
  - capability_id
  - canonical_name
  - aliases
  - repository_implementations
  - comparison
  - adaptation_history
  - provenance
properties:
  schema_version:
    type: string
    pattern: '^[0-9]+\.[0-9]+\.[0-9]+$'
  record_type:
    const: canonical-reference-capability
  capability_id:
    type: string
    pattern: '^CAP-[A-Z0-9]+(?:-[A-Z0-9]+)*$'
  canonical_name:
    type: string
    minLength: 1
  aliases:
    type: array
    uniqueItems: true
    items:
      type: string
      minLength: 1
  repository_implementations:
    type: array
    items:
      type: object
      additionalProperties: false
      required: [repository_id, pinned_sha, feature_ids, knowledge_object_ids, state]
      properties:
        repository_id:
          type: string
          minLength: 1
        pinned_sha:
          type: string
          pattern: '^[0-9a-f]{40}$'
        feature_ids:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            minLength: 1
        knowledge_object_ids:
          type: array
          uniqueItems: true
          items:
            type: string
            pattern: '^RKO-[A-Z0-9]+(?:-[A-Z0-9]+)*$'
        state:
          enum: [CATALOGED, ANALYSIS_REQUIRED, UNDERSTANDING_IN_PROGRESS, UNDERSTOOD, STALE, SUPERSEDED, BLOCKED]
  comparison:
    type: object
    additionalProperties: false
    required: [availability, eligible_repository_ids, last_compared_at]
    properties:
      availability:
        enum: [UNAVAILABLE, PARTIAL, AVAILABLE, STALE]
      eligible_repository_ids:
        type: array
        uniqueItems: true
        items:
          type: string
      last_compared_at:
        type: [string, 'null']
        format: date-time
  adaptation_history:
    type: array
    items:
      type: object
      additionalProperties: false
      required: [adaptation_id, state, path, source_knowledge_object_ids, created_at, approval_reference]
      properties:
        adaptation_id:
          type: string
          pattern: '^ADAPT-[A-Z0-9]+(?:-[A-Z0-9]+)*$'
        state:
          enum: [PROPOSED, APPROVED, REJECTED, SUPERSEDED]
        path:
          type: string
          minLength: 1
        source_knowledge_object_ids:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            pattern: '^RKO-[A-Z0-9]+(?:-[A-Z0-9]+)*$'
        created_at:
          type: string
          format: date-time
        approval_reference:
          type: [string, 'null']
  provenance:
    type: array
    items:
      type: object
      additionalProperties: false
      required: [repository_id, feature_ids, knowledge_object_ids]
      properties:
        repository_id:
          type: string
          minLength: 1
        feature_ids:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
        knowledge_object_ids:
          type: array
          uniqueItems: true
          items:
            type: string
            pattern: '^RKO-[A-Z0-9]+(?:-[A-Z0-9]+)*$'
